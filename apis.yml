aid: whatscookin
name: WhatsCookin'
description: WhatsCookin' is a community cooperation platform — a "Cooperation Engine for Communities"
  — that helps people organize local and virtual gatherings and build healthy social connections. Members
  join or create Circles (community spaces for conversation and events), post Offers to gauge interest
  in potential events, and make Wishes that others can fulfill by hosting. Communities span wellness,
  community-building, language exchange, and food, with active circles in Tucson, Queens, San Francisco,
  and Oakland. It is available on the web and as native iOS and Android apps. Backed by Bloomberg Beta.
  There is no public developer/API surface at this time.
